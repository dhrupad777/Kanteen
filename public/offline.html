<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FF8C00" />
  <title>Kanteen — You're Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #FFF2E5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      margin: 0;
      padding: 1.5rem;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 2.5rem 2rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      max-width: 320px;
      width: 100%;
      text-align: center;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; display: block; }
    h1 { color: #FF8C00; font-size: 1.4rem; font-weight: 700; margin: 0 0 0.5rem; }
    p  { color: #888; font-size: 0.9rem; line-height: 1.6; margin: 0 0 1.75rem; }
    button {
      background: #FF8C00;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 0.8rem 2rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s;
    }
    button:active { background: #e07a00; transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">🍽️</span>
    <h1>You're Offline</h1>
    <p>Kanteen needs a connection to show your orders.<br>Check your internet and try again.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
