    value: AIzaSyAJeWxw_YF2ooBqxL7J0knpqatSeC2qXyE
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: studio-1083756985-9d2c6.firebaseapp.com
    availability:
      - BUILD
